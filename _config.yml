# Jekyll, as GitHub Pages runs it. Content lives in _data/<lang>/ and _blog/<lang>/;
# edit it at /admin/ or by hand.
title: Ali Abbasi
url: https://aliarabbasi5155.github.io
# A user site lives at the domain root; set explicitly so builds never guess
baseurl: ""
timezone: UTC

# Keep generated application links public even when Jekyll overrides site.url
# with localhost while serving a development preview.
outreach:
  url: https://aliarabbasi5155.github.io

# Only the owner's hostname sends analytics. Clones must use their own IDs/hosts.
analytics:
  allowed_hosts: [aliarabbasi5155.github.io]
  measurement_ids: [G-M1XGN1K27Z, G-SN7JFYP48S]

collections:
  blog:
    # Posts are shown inside the one page, not as pages of their own
    output: false

defaults:
  - scope:
      path: _blog/en
      type: blog
    values:
      lang: en
  - scope:
      path: _blog/fa
      type: blog
    values:
      lang: fa

exclude:
  - README.md
  - tests
  - bin
  - vendor
  - Gemfile
  - Gemfile.lock

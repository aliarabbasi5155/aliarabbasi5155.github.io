# Jekyll, as GitHub Pages runs it. Content lives in _data/<lang>/ and _blog/<lang>/;
# edit it at /admin/ or by hand.
title: Ali Abbasi
url: https://aliarabbasi5155.github.io
# A user site lives at the domain root; set explicitly so builds never guess
baseurl: ""
timezone: UTC

# Keep generated application links public even when Jekyll overrides site.url
# with localhost while serving a development preview.
outreach:
  url: https://aliarabbasi5155.github.io

# Only the owner's hostname sends analytics. Clones must use their own IDs/hosts.
analytics:
  allowed_hosts: [aliarabbasi5155.github.io]
  measurement_ids: [G-M1XGN1K27Z, G-SN7JFYP48S]

# The site's languages, in the order the language switches show them: each its own
# name and its page. Content for each lives in _data/<code>/ and _blog/<code>/, and its
# page is <code>/index.html (English at /), which says if it reads right to left.
languages:
  - { code: en, name: English, url: / }
  - { code: it, name: Italiano, url: /it/ }
  - { code: fa, name: فارسی, url: /fa/ }

collections:
  blog:
    # Posts are shown inside the one page, not as pages of their own
    output: false

defaults:
  - scope:
      path: _blog/en
      type: blog
    values:
      lang: en
  - scope:
      path: _blog/it
      type: blog
    values:
      lang: it
  - scope:
      path: _blog/fa
      type: blog
    values:
      lang: fa

exclude:
  - README.md
  - tests
  - bin
  - vendor
  - Gemfile
  - Gemfile.lock

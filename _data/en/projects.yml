  - title: COVID-19 Pandemic Network Modelling Using GSM Mobility Data and SIR Model
    links:
      - label: GitHub
        url: https://github.com/aliarabbasi5155/Pandemic-Network-Simulation
        icon: fab fa-github
    org: Polytechnic University of Turin
    period: Jan 2024 - Mar 2024
    bullets:
      - Developed a network model to simulate the spread of COVID-19 using GSM mobility data and the SIR model on weekly basis.
      - Used library such as NetworkX, Pandas, and NumPy for data manipulation and analysis.
      - Used CUDA for efficient HPC of the SIR model on large-scale networks.
      - Analyzed the impact of mobility patterns on the transmission dynamics of the virus.
      - Implemented various scenarios to assess the effectiveness of different intervention strategies.
    tech:
      - NetworkX
      - Pandas
      - NumPy
      - CUDA
      - SIR Model
  - title: "Distributed Learning on CIFAR-100 dataset: Data-Parallelism Study"
    links:
      - label: GitHub
        url: https://github.com/aliarabbasi5155/Distributed-Machine-Learning-Algorithms
        icon: fab fa-github
    org: Polytechnic University of Turin
    period: Nov 2023 - Dec 2023
    bullets:
      - Implemented distributed machine learning algorithms, LocalSGD, Distributed SGD, SlowMo, and LocalAdaScale over multiple GPU nodes.
      - Compared the performance of algorithms on CIFAR-100 dataset in terms of convergence speed, accuracy, and communication overhead.
    tech:
      - PyTorch
      - Distributed Learning
      - CIFAR-100
      - GPU Computing

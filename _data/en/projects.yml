items:
  - title: Vector DB Manager for Weaviate and Qdrant
    links:
      - label: GitHub
        url: https://github.com/aliarabbasi5155/vector-db-manager
        icon: fab fa-github
    org: Personal Project
    period: Mar 2025
    bullets:
      - "Next.js/TypeScript dashboard for managing Weaviate and Qdrant vector databases: CRUD over collections and objects, semantic and hybrid search, live metrics, and one-command Docker deployment."

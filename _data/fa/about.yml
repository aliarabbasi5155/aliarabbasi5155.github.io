paragraphs:
  - "**AI / GenAI Engineer** و Technical Lead هستم، با بیش از ۵ سال سابقه‌ی توسعه‌ی نرم‌افزار، و هنوز خودم هم مستقیم کد می‌زنم. کارم را به‌عنوان Fullstack Developer شروع کردم و حالا تمرکزم روی ساخت و راه‌اندازی سیستم‌های GenAI در production است. مسئولیت محصولات مبتنی بر LLM را از ابتدا تا انتها بر عهده می‌گیرم: از طراحی راه‌حل و معماری agentic RAG گرفته تا fine-tuning، ارزیابی (evaluation) و deploy پایدار روی AWS با سرویس‌های containerized، CI/CD و مانیتورینگ production."
  - "تجربه‌ی پژوهش کاربردی را با مسئولیت تحویل محصول ترکیب می‌کنم؛ تیم‌های کوچک را هدایت می‌کنم و نیازهای مبهم stakeholderها را به سیستم‌های AI قابل‌اتکا در production تبدیل می‌کنم. پیشینه‌ام همچنین Reinforcement Learning، Computer Vision و پژوهش کاربردیِ منتشرشده را در بر می‌گیرد."

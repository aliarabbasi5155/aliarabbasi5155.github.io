items:
  - title: Transforming Stroop task cognitive assessments with multimodal Inverse Reinforcement Learning
    authors: "**Ali Abbasi**, Jiaqi Gong, Soroush Korivand"
    journal: Smart Health
    details: 36, p. 100567, 2025. Elsevier
    url: https://www.sciencedirect.com/science/article/pii/S2352648325000285
    link_label: مشاهده‌ی مقاله
    abstract: این پژوهش رویکرد تازه‌ای برای سنجش شناختی ارائه می‌دهد که با Inverse Reinforcement Learning چندوجهی (multimodal)، رفتار نگاه انسان را در حین انجام تسک‌های Stroop بازسازی می‌کند. این مطالعه داده‌های EEG را با اطلاعات eye-tracking ترکیب می‌کند تا فرایندهای شناختی و الگوهای تصمیم‌گیری را در سطوح مختلف cognitive load بهتر بشناسد.

      - src: /assets/publications/gaze-irl/setup.webp
        thumb: /assets/publications/gaze-irl/setup-thumb.webp
        caption: "آزمایش: حسگرهای EEG و fNIRS، و آزمون Stroop روی صفحه"
      - src: /assets/publications/gaze-irl/method.webp
        thumb: /assets/publications/gaze-irl/method-thumb.webp
        caption: "روش: EEG و مسیرهای نگاه انسان یک مدل GAIL را آموزش می‌دهند"
      - src: /assets/publications/gaze-irl/brain.webp
        thumb: /assets/publications/gaze-irl/brain-thumb.webp
        caption: "فعالیت مغز هنگام انجام آزمون، از پنج زاویه"

  suggestions:
    - علی کجا کار می‌کند؟
    - تا حالا تیمی را رهبری کرده؟
    - با RAG چه چیزهایی ساخته؟
    - از کدام cloud استفاده می‌کند؟
    - مقاله‌ی علمی هم منتشر کرده؟
    - برای تفریح چه کار می‌کند؟
  nudges:
    - پیست… من کلی چیز درباره‌ی علی می‌دانم. بپرس 👀
    - من علینو هستم! به سؤال‌های درباره‌ی علی جواب می‌دهم، جوک‌های بی‌مزه هم مجانی تعریف می‌کنم.
    - شرط می‌بندم نمی‌توانی با یک سؤال درباره‌ی علی کم بیاورم 😏
    - هی، تو! آره، خودت. خبرهای دست‌اول درباره‌ی علی می‌خواهی؟
    - کل رزومه‌ی علی را خوانده‌ام. دو بار. امتحانم کن!
    - استخدام‌کننده‌ای؟ کنجکاوی؟ گم شده‌ای؟ دست‌کم در دوتایش کمکت می‌کنم 😄
    - به من گفته‌اند ساکت بمانم. اصلاً بلد نیستم. یک چیزی بپرس!
    - رویم بزن، از قیافه‌ام خیلی خوش‌اخلاق‌ترم 🫧
    - "یک واقعیت جالب: من هیچ‌وقت از سؤال درباره‌ی علی خسته نمی‌شوم. هیچ‌وقت."
    - خجالت نکش، من درباره‌ی علی فقط حرف خوب دارم.
  section_nudges:
    experience: حوصله‌ی خواندن همه‌اش را نداری؟ خلاصه‌اش را از من بپرس 😉
    projects: از من بپرس کدام‌یک از این‌ها را با RAG ساخته. جرئتش را داری؟
    skills: دنبال مهارت خاصی هستی؟ فقط بپرس، نشانت می‌دهم کجاست.
    education: تورین، پژوهش، پایان‌نامه… قصه‌اش را می‌خواهی؟ بپرس!
    publications: اصطلاحات علمی در راه است! از من بخواه به زبان ساده بگویم.
    blog: درباره‌ی کتاب هم می‌نویسد. بپرس کدام کتاب‌ها!
    interests: درباره‌ی تیم فوتبالش از من بپرس. یالا. بپرس 🙈
  refusals:
    - وای، وسوسه‌انگیز است! ولی توی مغز من فقط جای یک موضوع هست، آن هم علی. می‌خواهی بدانی این روزها چه می‌سازد؟
    - دوست داشتم کمک کنم، ولی من فقط یک هنر دارم و آن هم علی است 🐴 درباره‌ی کارش، پروژه‌هایش یا درسش بپرسی؟
    - این یکی از حقوق من بالاتر است. حقوق من را با سؤال درباره‌ی علی می‌دهند، پس بیا از همان‌ها خرج کنیم!
    - "پیچش داستان: من فقط علی را می‌شناسم. برایت از سیستم‌های AI که ساخته و راه انداخته بگویم؟"
    - دفترچه‌ی راهنمای من فقط یک فصل دارد، اسمش هم «علی» است. با هم بازش کنیم؟
    - می‌توانم حدس بزنم، ولی فقط چیزی از خودم درمی‌آورم، و علی من را این‌طوری بار نیاورده. به‌جایش درباره‌ی خودش بپرسی؟
    - "نقطه‌ضعفم را پیدا کردی: هر چیزی که علی نباشد. سؤالی درباره‌ی او داری؟"
    - این یکی را به موتورهای جست‌وجو می‌سپارم. من اینجا هستم برای سؤال‌های علی، پس بپرس!
    - "اگر به این جواب بدهم، باید به علی جواب پس بدهم. بیا سراغ خودش برویم: مهارت‌ها، پروژه‌ها، پژوهش؟"
    - هوم، این بیرون از گوشه‌ی کوچک من در اینترنت است. گوشه‌ی من کلاً درباره‌ی علی است. چه می‌خواهی بدانی؟
  closing: فکر کنم حسابی از علی دور شدیم، پس من اینجا کمی استراحت می‌کنم ☕ هر وقت سؤالی درباره‌ی او داشتی برگرد، سراپا گوشم!
  # When the AI can't be reached, Alino answers on the page, from the lines that match best
  page:
    lead: "رزومه‌اش این را می‌گوید:"
    not_found: "هوم، رزومه‌اش در این باره چیزی نمی‌گوید. ولی می‌توانی مستقیم از خودش بپرسی: ایمیلش روی کارتش هست"
    teases:
      - بگذار یادداشت‌هایم را ببینم… وای نه، قهوه رویشان ریخت! شوخی کردم، سالم‌اند. 😜
      - هوم، این اطلاعات محرمانه است… شوخی کردم، توی رزومه‌اش هست. 😄
      - یک لحظه، هنوز دارم روشن می‌شوم… شوخی کردم، از اول آماده بودم. 🙈
      - ای وای، سؤال سختی است! بگذار خوب فکر کنم… شوخی کردم، از سؤال‌های محبوبم است. 😅
      - صبر کن ببینم، استخدام‌کننده‌ای یا جاسوس؟ شوخی کردم، همه‌چیز را می‌گویم. 🤭
    thanks: خواهش می‌کنم! چیز دیگری هست که بخواهی درباره‌ی علی بدانی؟
    bye: فعلاً خداحافظ! گپ زدن با تو خیلی خوش گذشت. هر وقت درباره‌ی علی کنجکاو شدی برگرد 👋
    how: افتضاح، یک دقیقه‌ی تمام کسی درباره‌ی علی چیزی نپرسید! …شوخی کردم، عالی‌ام، ممنون که پرسیدی. خودت چطوری؟ چیزی هست که بخواهی درباره‌اش بدانی؟
    who: معلوم است، من علی‌ام. …باشه، باشه، من علینو هستم، دستیارش. رزومه‌اش را از بَرم، پس بپرس!
    hello: وای! ترساندی‌ام، روی رزومه‌ی علی چرت می‌زدم 😴 سلام! من علینو هستم. روزت چطور می‌گذرد؟ هر چه درباره‌ی علی می‌خواهی بپرس.

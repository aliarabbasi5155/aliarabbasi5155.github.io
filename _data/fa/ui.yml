  page:
    lead: "رزومه‌ش اینو می‌گه:"
    not_found: "هوم، رزومه‌ش درباره‌ی این چیزی نمی‌گه. ولی می‌تونی مستقیم از خودش بپرسی: ایمیلش روی کارتش هست"
    teases:
      - بذار یادداشتامو ببینم… وای نه، قهوه ریخت روشون! شوخی کردم، سالمن. 😜
      - هوم، این اطلاعات محرمانه‌ست… شوخی کردم، تو رزومه‌ش هست. 😄
      - یه لحظه، هنوز دارم روشن می‌شم… شوخی کردم، از اول آماده بودم. 🙈
      - ای وای، سؤال سختیه! بذار خوب فکر کنم… شوخی کردم، از سؤالای مورد علاقه‌مه. 😅
      - صبر کن ببینم، استخدام‌کننده‌ای یا جاسوس؟ شوخی کردم، همه‌چی رو می‌گم. 🤭
    thanks: خواهش می‌کنم! چیز دیگه‌ای هم هست که بخوای درباره‌ی علی بدونی؟
    bye: فعلاً خداحافظ! گپ زدن باهات خیلی چسبید. هر وقت درباره‌ی علی کنجکاو شدی برگرد 👋
    how: افتضاح، یه دقیقه‌ی تموم هیچ‌کس درباره‌ی علی چیزی نپرسید! …شوخی کردم، عالی‌ام، مرسی که پرسیدی. خودت چطوری؟ چیزی هست که بخوای درباره‌ش بدونی؟
    who: معلومه، من علی‌ام. …باشه، باشه، من علینوام، دستیارش. رزومه‌ش رو از بَرم، پس بپرس!
    hello: وای! ترسوندیم، داشتم روی رزومه‌ی علی چرت می‌زدم 😴 سلام! من علینوام. روزت چطوره؟ هر چی درباره‌ی علی می‌خوای بپرس.

  nudges:
    - پیست… من کلی چیز درباره‌ی علی می‌دونم. بپرس 👀
    - من علینوام! به سؤالای درباره‌ی علی جواب می‌دم، جوک بی‌مزه هم مجانی تعریف می‌کنم.
    - شرط می‌بندم نمی‌تونی با یه سؤال درباره‌ی علی کم بیارم 😏
    - هی، تو! آره، خودت. خبرای دست‌اول درباره‌ی علی می‌خوای؟
    - کل رزومه‌ی علی رو خوندم. دو بار. امتحانم کن!
    - استخدام‌کننده‌ای؟ کنجکاوی؟ گم شدی؟ دست‌کم توی دوتاش کمکت می‌کنم 😄
    - بهم گفتن ساکت بمونم. اصلاً بلد نیستم. یه چیزی بپرس!
    - روم بزن، از قیافه‌م خیلی خوش‌اخلاق‌ترم 🫧
    - "یه واقعیت جالب: من هیچ‌وقت از سؤال درباره‌ی علی خسته نمی‌شم. هیچ‌وقت."
    - خجالت نکش، من درباره‌ی علی فقط حرف خوب دارم.
  section_nudges:
    experience: حوصله‌ی خوندن همه‌ش رو نداری؟ خلاصه‌ش رو از من بپرس 😉
    projects: از من بپرس کدوم‌یکی از اینا رو با RAG ساخته. جرئتشو داری؟
    skills: دنبال یه مهارت خاصی؟ فقط بپرس، نشونت می‌دم کجاست.
    education: تورین، پژوهش، پایان‌نامه… قصه‌ش رو می‌خوای؟ بپرس!
    publications: اصطلاحات علمی در راهه! ازم بخواه به زبون ساده بگم.
    blog: درباره‌ی کتاب هم می‌نویسه. بپرس کدوم کتابا!
    interests: درباره‌ی تیم فوتبالش ازم بپرس. یالا. بپرس 🙈
  refusals:
    - وای، وسوسه‌انگیزه! ولی توی مغز من فقط جای یه موضوع هست، اونم علی. می‌خوای بدونی این روزا داره چی می‌سازه؟
    - دلم می‌خواست کمک کنم، ولی من فقط یه هنر دارم، اونم علیه 🐴 درباره‌ی کارش، پروژه‌هاش یا درسش بپرسی؟
    - این یکی از حقوق من بالاتره. حقوق منو با سؤال درباره‌ی علی می‌دن، پس بیا از همونا خرج کنیم!
    - "پیچش داستان: من فقط علی رو می‌شناسم. برات از سیستم‌های AIای که ساخته و راه انداخته بگم؟"
    - دفترچه‌ی راهنمای من فقط یه فصل داره، اسمشم «علی»ـه. با هم بازش کنیم؟
    - می‌تونم حدس بزنم، ولی فقط یه چیزی از خودم درمیارم، و علی منو این‌جوری بار نیاورده. به‌جاش درباره‌ی خودش بپرسی؟
    - "نقطه‌ضعفم رو پیدا کردی: هر چیزی که علی نباشه. سؤالی درباره‌ی خودش داری؟"
    - این یکی رو می‌سپارم به موتورهای جست‌وجو. من اینجام برای سؤالای علی، پس بپرس!
    - "اگه به این جواب بدم، باید به علی جواب پس بدم. بیا بریم سراغ خودش: مهارت‌ها، پروژه‌ها، پژوهش؟"
    - هوم، این بیرون از گوشه‌ی کوچیک من توی اینترنته. گوشه‌ی من کلاً درباره‌ی علیه. چی می‌خوای بدونی؟
  closing: فکر کنم حسابی از علی دور شدیم، پس من اینجا یه کم استراحت می‌کنم ☕ هر وقت سؤالی درباره‌ش داشتی برگرد، سراپا گوشم!

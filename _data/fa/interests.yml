items:
  - icon: fas fa-book-open
    title: کتاب خواندن
    text: شیفته‌ی کتاب‌های نوآوری در کسب‌وکار (مثل اریک ریس) و کتاب‌های درجه‌یک توسعه‌ی فردی (مثل کال نیوپورت) هستم.
  - icon: fas fa-futbol
    title: فوتبال
    text: بیش از حد بازی‌های لیورپول را تماشا می‌کنم و با دوستانم FIFA بازی می‌کنم.
  - icon: fas fa-graduation-cap
    title: یادگیری
    text: همیشه درباره‌ی ترندهای جدید تکنولوژی می‌خوانم یا دوره‌های آنلاین می‌گذرانم؛ این روزها تمرکزم روی ترندهای AI است.
  - icon: fas fa-biking
    title: دوچرخه‌سواری شبانه
    text: ۳۰ تا ۴۰ دقیقه رکاب زدن در شهر بعد از تاریک شدن هوا؛ راه همیشگی من برای شارژ کامل ذهن و بدن.

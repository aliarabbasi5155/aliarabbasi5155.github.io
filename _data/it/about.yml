paragraphs:
  - "**AI / GenAI Engineer** e technical lead operativo, con oltre 5 anni di esperienza nello sviluppo software: ho iniziato come sviluppatore fullstack e oggi mi dedico a portare in produzione sistemi di GenAI. Seguo i prodotti basati su LLM dall'inizio alla fine: dalla progettazione della soluzione e dall'architettura agentic RAG al fine-tuning, alla valutazione e a un deployment affidabile su AWS, con servizi containerizzati, CI/CD e monitoraggio in produzione."
  - "Unisco l'esperienza nella ricerca applicata alla responsabilità di consegnare: guido piccoli team e trasformo esigenze ancora vaghe degli stakeholder in sistemi di AI in produzione. Il mio percorso comprende anche Reinforcement Learning, Computer Vision e ricerca applicata pubblicata."
